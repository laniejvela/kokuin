:root{
  --bg:#f6f6f4; --panel:#ffffff; --line:#e2e2dd; --ink:#2c2c2c; --sub:#7a7a72;
  --accent:#8a7a5c; --accent-w:#fff;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color:var(--ink); background:var(--bg); overscroll-behavior:none;
}
#app{ display:flex; flex-direction:column; height:100%; }

/* ---------- stage ---------- */
#stageWrap{
  flex:1 1 auto; min-height:34vh; position:relative;
  display:flex; align-items:center; justify-content:center;
  background:#e9e9e5;
  padding:10px; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden;
}
#preview{ display:block; box-shadow:0 2px 14px rgba(0,0,0,.18); cursor:grab; }
#preview.drag{ cursor:grabbing; }
#hint{
  position:absolute; left:0; right:0; bottom:4px; text-align:center;
  font-size:11px; color:var(--sub); pointer-events:none;
}

/* ---------- panel ---------- */
#panel{
  flex:0 0 auto; max-height:62vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--panel); border-top:1px solid var(--line);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
}
.row{ margin-bottom:14px; }
.row:last-child{ margin-bottom:0; }
label.h{ display:block; font-size:11px; letter-spacing:.08em; color:var(--sub); margin-bottom:6px; }
textarea{
  width:100%; min-height:58px; resize:vertical; font-size:16px; line-height:1.4;
  padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fcfcfb;
  font-family:inherit; color:var(--ink);
}
.grid{ display:grid; gap:6px; }
.g7{ grid-template-columns:repeat(2,1fr); }
.g4{ grid-template-columns:repeat(4,1fr); }
.g3{ grid-template-columns:repeat(3,1fr); }
button.opt{
  border:1px solid var(--line); background:#fcfcfb; border-radius:8px; padding:8px 6px;
  font-size:13px; color:var(--ink); display:flex; align-items:center; gap:8px; justify-content:flex-start;
  min-height:46px; overflow:hidden; cursor:pointer; font-family:inherit;
}
button.opt .num{ font-size:11px; color:var(--sub); flex:0 0 auto; width:14px; text-align:center; }
button.opt .smp{ font-size:19px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:clip; }
button.opt.on{ border-color:var(--accent); background:#f5f1e8; box-shadow:inset 0 0 0 1px var(--accent); }
button.opt.center{ justify-content:center; }
.bgs{ grid-template-columns:repeat(4,1fr); }
.bgs button{ flex-direction:column; gap:4px; min-height:76px; padding:6px 3px; }
.bgs img{ height:38px; width:auto; max-width:100%; object-fit:contain; }
.bgs .cap{ font-size:9px; color:var(--sub); line-height:1.15; text-align:center; word-break:break-all; }
.lay{ flex-direction:column; gap:3px; min-height:58px; }
.lay .ic{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:.02em; }
.lay .cap{ font-size:10px; color:var(--sub); }
.slider{ display:flex; align-items:center; gap:10px; }
input[type=range]{ flex:1; accent-color:var(--accent); height:28px; }
.val{ font-size:12px; color:var(--sub); width:48px; text-align:right; font-variant-numeric:tabular-nums; }
.actions{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; }
button.act{
  border:1px solid var(--line); background:#fcfcfb; border-radius:9px; padding:12px 8px;
  font-size:14px; color:var(--ink); cursor:pointer; font-family:inherit;
}
button.act.primary{ background:var(--accent); color:var(--accent-w); border-color:var(--accent); font-weight:600; }
button.act:disabled{ opacity:.5; }
.mini{ font-size:11px; color:var(--sub); line-height:1.5; }
.chk{ display:flex; align-items:center; gap:7px; font-size:13px; }
.chk input{ width:17px; height:17px; accent-color:var(--accent); }
.warn{ color:#a35b2a; font-size:11px; margin-top:5px; display:none; }
.note{ color:var(--sub); font-size:11px; margin-top:5px; display:none; line-height:1.5; }
button.opt:disabled{ opacity:.35; cursor:default; }
.disclaimer{
  font-size:11px; line-height:1.7; color:var(--sub);
  border-top:1px solid var(--line); padding-top:12px; margin-top:4px;
}
#file{ display:none; }
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:rgba(30,30,30,.92); color:#fff; padding:10px 16px; border-radius:20px;
  font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50;
}
.toast.on{ opacity:1; }

@media (min-width:820px){
  #app{ flex-direction:row; }
  #stageWrap{ min-height:100%; padding:24px; }
  #panel{ flex:0 0 380px; max-height:100%; border-top:none; border-left:1px solid var(--line); }
  .g7{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="preview"></canvas>
    <div id="hint">ドラッグで移動／ピンチ・ホイールで大きさ変更</div>
  </div>

  <div id="panel">
    <div class="row">
      <label class="h" for="txt">刻印内容（改行で2行目・3行目）</label>
      <textarea id="txt" spellcheck="false" autocapitalize="off" autocomplete="off">LANIE</textarea>
    </div>

    <div class="row">
      <label class="h">書体</label>
      <div class="grid g7" id="fonts"></div>
<!-- customer:start -->
      <div class="note" id="jpnote">漢字・ひらがな・カタカナは ⑦ 凸版文久明朝 のみ対応しています。</div>
<!-- customer:end -->
      <div class="warn" id="fwarn">⑦ 凸版文久明朝 がこの端末に見つからないため、代替の明朝体（ヒラギノ明朝など）で表示しています。</div>
    </div>

    <div class="row">
      <label class="h">レイアウト</label>
      <div class="grid g4" id="layouts"></div>
    </div>

    <div class="row">
      <label class="h">文字の大きさ</label>
      <div class="slider">
        <input type="range" id="size" min="10" max="400" value="100">
        <span class="val" id="sizeV">100%</span>
      </div>
    </div>


    <div class="row">
      <label class="h">文字色</label>
      <div class="grid g3" id="colors"></div>
    </div>

    <div class="row">
      <label class="h">背景（ペンダント画像）</label>
      <div class="grid bgs" id="bgs"></div>
    </div>


    <div class="row actions">
      <button class="act" id="reset">位置・大きさをリセット</button>
    </div>

<!-- customer:start -->
    <div class="row disclaimer">
      ※本シミュレーターは刻印内容をその通りにオーダーするためのものではございません。あくまでイメージとしてご参考にするためにご使用ください。
    </div>
<!-- customer:end -->
  </div>
</div>
<div class="toast" id="toast"></div>

/* =========================================================
   共通描画（プレビューとPDFで同じ関数を使う＝WYSIWYG）
   ========================================================= */
function fontCss(px, id){
  const f = FONTS.find(f => f.id === id) || FONTS[2];
  return px + "px " + f.css;
}

/* ---------------------------------------------------------
   文字の分割
   ☆ や ❄ などは「記号＋異体字セレクタ」の組み合わせになっていることがあり、
   1コードポイントずつ描くと組み合わせが外れてカラー絵文字になってしまう。
   書記素（見た目の1文字）単位に分けたうえで、常に文字表示（白抜き記号）を指定する。
   --------------------------------------------------------- */
const SEGMENTER = (typeof Intl !== "undefined" && Intl.Segmenter)
  ? new Intl.Segmenter("ja", { granularity:"grapheme" }) : null;

function graphemes(str){
  if (SEGMENTER) return Array.from(SEGMENTER.segment(str), s => s.segment);
  const out = [];                       // Intl.Segmenter が無い環境用
  for (const ch of str){
    const cp = ch.codePointAt(0);
    const join = (cp >= 0xFE00 && cp <= 0xFE0F) || (cp >= 0x0300 && cp <= 0x036F)
              || cp === 0x200D || (cp >= 0x1F3FB && cp <= 0x1F3FF);
    if (join && out.length) out[out.length - 1] += ch; else out.push(ch);
  }
  return out;
}

let EMOJI_PRESENTATION = null;
try{ EMOJI_PRESENTATION = new RegExp("\\p{Emoji_Presentation}", "u"); }catch(e){}

/* 絵文字表示を文字表示に固定する（⭐ → ☆ のような白抜き記号になる） */
const VS_TEXT  = "︎";   // 文字表示セレクタ
const VS_EMOJI = "️";   // 絵文字表示セレクタ
function asTextStyle(g){
  g = g.split(VS_EMOJI).join(VS_TEXT);
  if (g.indexOf(VS_TEXT) < 0 && EMOJI_PRESENTATION && EMOJI_PRESENTATION.test(g)) g += VS_TEXT;
  return g;
}
function cells(line){ return graphemes(line).map(asTextStyle); }

function measureRun(c, chars, px){
  const sp = px * state.track / 100;
  let w = 0;
  for (const ch of chars) w += c.measureText(ch).width;
  return w + sp * Math.max(0, chars.length - 1);
}

function drawRun(c, chars, cx, cy, px){
  const sp = px * state.track / 100;
  const total = measureRun(c, chars, px);
  let x = cx - total / 2;
  c.textAlign = "left"; c.textBaseline = "middle";
  for (const ch of chars){
    c.fillText(ch, x, cy);
    x += c.measureText(ch).width + sp;
  }
}

/* 文字ブロックを (cx,cy) 中心に描く。px＝フォントサイズ(px) */
function drawText(c, cx, cy, px, text, layout){
  const lines = text.split("\n");
  c.save();
  c.fillStyle = state.color;
  c.font = fontCss(px, state.font);

  if (layout === 4){
    // 縦積み：各文字は正立。複数行は列となり右→左に並ぶ
    const colW  = px * 1.15;
    const charH = px * (1 + state.track / 100);
    const n = lines.length;
    c.translate(cx, cy);
    lines.forEach((line, j) => {
      const chars = cells(line);
      const m = chars.length;
      const colX = ((n - 1) / 2 - j) * colW;
      chars.forEach((ch, k) => {
        const y = (-(m - 1) / 2 + k) * charH;
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText(ch, colX, y);
      });
    });
  } else {
    const rot = layout === 2 ? Math.PI / 2 : layout === 3 ? -Math.PI / 2 : 0;
    const lineH = px * 1.3;
    const n = lines.length;
    c.translate(cx, cy);
    if (rot) c.rotate(rot);
    lines.forEach((line, i) => {
      const y = (-(n - 1) / 2 + i) * lineH;
      drawRun(c, cells(line), 0, y, px);
    });
  }
  c.restore();
}

/* 背景画像＋刻印文字。w,h は描画領域のピクセルサイズ */
function drawScene(c, w, h){
  c.save();
  c.clearRect(0, 0, w, h);
  c.fillStyle = "#ffffff";                 // 透過PNGでも紙と同じ白地になるように
  c.fillRect(0, 0, w, h);
  if (bgImg) c.drawImage(bgImg, 0, 0, w, h);
  const px = state.size * h;
  drawText(c, state.x * w, state.y * h, px, state.text, state.layout);
  c.restore();
}

/* =========================================================
   プレビュー
   ========================================================= */
function fitPreview(){
  const wrap = $("#stageWrap");
  const pad = 20;
  const availW = wrap.clientWidth - pad, availH = wrap.clientHeight - pad;
  if (!bgImg || availW <= 0 || availH <= 0) return;
  const ar = bgImg.naturalWidth / bgImg.naturalHeight;
  let w = availW, h = w / ar;
  if (h > availH){ h = availH; w = h * ar; }
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  render();
}
function render(){
  if (!bgImg) return;
  drawScene(ctx, cv.width, cv.height);
}

/* =========================================================
   操作（ドラッグ／ピンチ／ホイール）
   ========================================================= */
const stage = $("#stageWrap");
let drag = null, pinch = null;

function toNorm(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x:(clientX - r.left) / r.width, y:(clientY - r.top) / r.height };
}
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
function setSize(s){
  state.size = clamp(s, 0.008, 0.9);
  const pct = Math.round(state.size / DEFAULT_STATE.size * 100);
  $("#size").value = clamp(pct, 10, 400);
  $("#sizeV").textContent = pct + "%";
  save();
}

stage.addEventListener("touchstart", e => {
  if (e.touches.length === 1){
    const p = toNorm(e.touches[0].clientX, e.touches[0].clientY);
    drag = { dx:state.x - p.x, dy:state.y - p.y }; pinch = null;
  } else if (e.touches.length === 2){
    drag = null;
    const [a, b] = e.touches;
    pinch = { d:Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), s:state.size };
  }
  e.preventDefault();
}, { passive:false });

stage.addEventListener("touchmove", e => {
  if (pinch && e.touches.length === 2){
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch.d > 0) setSize(pinch.s * d / pinch.d);
    render();
  } else if (drag && e.touches.length === 1){
    const p = toNorm(e.touches[0].clientX, e.touches[0].clientY);
    state.x = clamp(p.x + drag.dx, -0.2, 1.2);
    state.y = clamp(p.y + drag.dy, -0.2, 1.2);
    render(); save();
  }
  e.preventDefault();
}, { passive:false });

stage.addEventListener("touchend", e => {
  if (e.touches.length === 0){ drag = null; pinch = null; }
  else if (e.touches.length === 1){
    pinch = null;
    const p = toNorm(e.touches[0].clientX, e.touches[0].clientY);
    drag = { dx:state.x - p.x, dy:state.y - p.y };
  }
}, { passive:false });

/* マウス */
cv.addEventListener("mousedown", e => {
  const p = toNorm(e.clientX, e.clientY);
  drag = { dx:state.x - p.x, dy:state.y - p.y };
  cv.classList.add("drag"); e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const p = toNorm(e.clientX, e.clientY);
  state.x = clamp(p.x + drag.dx, -0.2, 1.2);
  state.y = clamp(p.y + drag.dy, -0.2, 1.2);
  render(); save();
});
window.addEventListener("mouseup", () => { drag = null; cv.classList.remove("drag"); });

/* ホイール／トラックパッド */
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.ctrlKey ? 0.012 : 0.004;            // ピンチズームは倍率を大きく
  setSize(state.size * Math.exp(-e.deltaY * k));
  render();
}, { passive:false });

/* Safari のトラックパッドピンチ */
let gs = 1;
stage.addEventListener("gesturestart", e => { e.preventDefault(); gs = state.size; }, { passive:false });
stage.addEventListener("gesturechange", e => { e.preventDefault(); setSize(gs * e.scale); render(); }, { passive:false });
stage.addEventListener("gestureend", e => e.preventDefault(), { passive:false });

/* =========================================================
   UI 構築
   ========================================================= */
/* ①〜⑥は欧文フォントなので、日本語が入ったら⑦だけを選べるようにする（お客様用のみ） */
const JAPANESE = /[々-〇぀-ヿ㐀-䶿一-鿿豈-﫿ｦ-ﾟ]/;
let fontBeforeJp = null;

function applyJapaneseRule(){
  if (!CUSTOMER) return false;
  const jp = JAPANESE.test(state.text);
  if (jp){
    if (state.font !== 7){ fontBeforeJp = state.font; state.font = 7; }
  } else if (fontBeforeJp !== null){
    if (state.font === 7) state.font = fontBeforeJp;
    fontBeforeJp = null;
  }
  const note = $("#jpnote");
  if (note) note.style.display = jp ? "block" : "none";
  return jp;
}

function buildFontButtons(){
  const box = $("#fonts"); box.innerHTML = "";
  const jpOnly = CUSTOMER && JAPANESE.test(state.text);
  FONTS.forEach(f => {
    const b = document.createElement("button");
    b.className = "opt" + (state.font === f.id ? " on" : "");
    b.innerHTML = `<span class="num">${"①②③④⑤⑥⑦"[f.id-1]}</span>`;
    const s = document.createElement("span");
    s.className = "smp"; s.style.fontFamily = f.css;
    s.textContent = sampleText();
    b.appendChild(s);
    b.title = f.name;
    if (jpOnly && f.id !== 7){
      b.disabled = true;
      b.title = f.name + "（日本語には対応していません）";
    }
    b.onclick = () => { state.font = f.id; buildFontButtons(); render(); save(); };
    box.appendChild(b);
  });
}
function sampleText(){
  const t = state.text.split("\n")[0].trim();
  return t ? cells(t).slice(0, 12).join("") : "Sample";
}
function buildLayoutButtons(){
  const box = $("#layouts"); box.innerHTML = "";
  LAYOUTS.forEach(l => {
    const b = document.createElement("button");
    b.className = "opt lay center" + (state.layout === l.id ? " on" : "");
    let ic = "";
    if (l.id === 1) ic = `<span class="ic">AB</span>`;
    if (l.id === 2) ic = `<span class="ic" style="transform:rotate(90deg)">AB</span>`;
    if (l.id === 3) ic = `<span class="ic" style="transform:rotate(-90deg)">AB</span>`;
    if (l.id === 4) ic = `<span class="ic" style="display:flex;flex-direction:column;line-height:.95">A<br>B</span>`;
    b.innerHTML = ic + `<span class="cap">${"①②③④"[l.id-1]} ${l.cap}</span>`;
    b.onclick = () => { state.layout = l.id; buildLayoutButtons(); render(); save(); };
    box.appendChild(b);
  });
}
function buildBgButtons(){
  const box = $("#bgs"); box.innerHTML = "";
  BGS.forEach(b => {
    const el = document.createElement("button");
    el.className = "opt center" + (state.bgId === b.id ? " on" : "");
    const im = document.createElement("img");
    im.src = b.src; im.alt = b.name;
    el.appendChild(im);
    const cap = document.createElement("span");
    cap.className = "cap"; cap.textContent = b.name;
    el.appendChild(cap);
    el.title = b.name;
    el.onclick = () => { state.bgId = b.id; state.bg = null; buildBgButtons(); loadBg(b.src); };
    box.appendChild(el);
  });
  if (state.bgId === "custom"){
    const el = document.createElement("button");
    el.className = "opt center on";
    el.innerHTML = `<span class="cap">選んだ画像</span>`;
    box.appendChild(el);
  }
}

function buildColorButtons(){
  const box = $("#colors"); box.innerHTML = "";
  COLORS.forEach(c => {
    const b = document.createElement("button");
    b.className = "opt center" + (state.color === c.v ? " on" : "");
    b.innerHTML = `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;
      background:${c.v};border:1px solid #bbb;margin-right:6px;vertical-align:-2px"></span>${c.cap}`;
    b.onclick = () => { state.color = c.v; buildColorButtons(); render(); save(); };
    box.appendChild(b);
  });
}

$("#txt").addEventListener("input", e => {
  state.text = e.target.value;
  applyJapaneseRule();
  buildFontButtons(); render(); save();
});
$("#size").addEventListener("input", e => {
  state.size = DEFAULT_STATE.size * (+e.target.value / 100);
  $("#sizeV").textContent = e.target.value + "%";
  render(); save();
});
if ($("#track")){                       // 字間スライダーはお客様用には無い
  $("#track").addEventListener("input", e => {
    state.track = +e.target.value;
    $("#trackV").textContent = e.target.value;
    render(); save();
  });
}
$("#reset").onclick = () => {
  state.x = DEFAULT_STATE.x; state.y = DEFAULT_STATE.y;
  setSize(DEFAULT_STATE.size); state.track = 0;
  if ($("#track")){ $("#track").value = 0; $("#trackV").textContent = "0"; }
  render(); save();
};

/* =========================================================
   背景画像
   ========================================================= */
function bgSrc(){
  if (state.bgId === "custom" && state.bg) return state.bg;
  const b = BGS.find(b => b.id === state.bgId);
  return b ? b.src : DEFAULT_BG;
}
function loadBg(src, retry){
  const im = new Image();
  im.onload = () => {
    bgImg = im;
    fitPreview(); checkExportable(); save();
  };
  im.onerror = () => {
    if (!retry){ setTimeout(() => loadBg(src, true), 400); return; }
    if (!bgImg && src !== DEFAULT_BG){ state.bgId = "std"; state.bg = null; buildBgButtons(); loadBg(DEFAULT_BG, true); }
    else toast("画像を読み込めませんでした");
  };
  im.src = src;
}

/* =========================================================
   保存 / 復元
   ========================================================= */
const STORE_KEY = CUSTOMER ? "kokuin_state_c" : "kokuin_state";

/* ドラッグ中に毎フレーム書き込むと重いので遅延させる */
let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}
function saveNow(){
  try{
    const s = Object.assign({}, state);
    // 選んだ写真が大きすぎるときは保存しない（次回は標準画像に戻る）
    if (s.bgId !== "custom" || !s.bg || s.bg.length > 3000000){ s.bg = null; }
    if (s.bgId === "custom" && !s.bg) s.bgId = "std";
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  }catch(e){}
}
function restore(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!s) return;
    Object.assign(state, s);
    if (state.bgId === "custom" && !state.bg) state.bgId = "std";
    if (!BGS.some(b => b.id === state.bgId) && state.bgId !== "custom") state.bgId = "std";
  }catch(e){}
}

/* =========================================================
   書き出し（お客様公開用ではビルド時に丸ごと削除される）
   ========================================================= */
let setStatus = () => {};
let checkExportable = () => {};
let LOCAL_FILE_MSG = "";


function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
}

/* =========================================================
   起動
   ========================================================= */
function checkToppan(){
  const c = document.createElement("canvas").getContext("2d");
  const probe = "永あA1";
  c.font = '80px "__no_such_font__",monospace';
  const base = c.measureText(probe).width;
  c.font = '80px "Toppan Bunkyu Mincho","ToppanBunkyuMinchoPr6N-Regular",monospace';
  const test = c.measureText(probe).width;
  toppanOK = Math.abs(base - test) > 0.5;
  $("#fwarn").style.display = toppanOK ? "none" : "block";
}

async function boot(){
  restore();
  if (CUSTOMER) state.track = 0;                 // 字間の調整は社内用のみ
  $("#txt").value = state.text;
  if ($("#track")){ $("#track").value = state.track; $("#trackV").textContent = state.track; }
  $("#sizeV").textContent = Math.round(state.size / DEFAULT_STATE.size * 100) + "%";
  $("#size").value = clamp(Math.round(state.size / DEFAULT_STATE.size * 100), 10, 400);
  applyJapaneseRule();
  buildFontButtons(); buildLayoutButtons(); buildColorButtons(); buildBgButtons();

  loadBg(bgSrc());

  try{
    await Promise.all(FONTS.slice(0,6).map(f =>
      document.fonts.load('40px ' + f.css, "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789")));
  }catch(e){}
  await document.fonts.ready;
  checkToppan();
  buildFontButtons(); render();
}
window.addEventListener("resize", fitPreview);
window.addEventListener("orientationchange", () => setTimeout(fitPreview, 300));
document.addEventListener("gesturestart", e => e.preventDefault(), { passive:false });
if (document.readyState === "complete") boot();
else window.addEventListener("load", boot);
</script>
